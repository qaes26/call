# ==============================================================================
# إعدادات Nginx المحصنة (Production Reverse Proxy with TLS 1.3 & WebSockets)
# المسار الموصى به: /etc/nginx/sites-available/my-parents-call
# ==============================================================================

# تعريف ترقية اتصال الـ WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# تحديد مناطق قياس وتحديد معدل الطلبات (Rate Limiting Zones)
limit_req_zone $binary_remote_addr zone=signaling_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# 1. إعادة توجيه كافة طلبات HTTP غير المشفرة إلى HTTPS تلقائياً وبشكل إجباري
server {
    listen 80;
    listen [::]:80;
    server_name myparents.yourdomain.com;

    # مسار التجديد التلقائي لشهادات Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. خادم HTTPS والوسيط العكسي (HTTPS & WSS Reverse Proxy)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myparents.yourdomain.com;

    # شهادات الأمان والتشفير (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/myparents.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myparents.yourdomain.com/privkey.pem;

    # ==========================================================================
    # تحصين معايير التشفير (SSL/TLS Hardening)
    # ==========================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # تفعيل تدقيق OCSP Stapling لمنع انتحال الشهادات
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ==========================================================================
    # ترويسات الأمان القصوى (Security Headers)
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=()" always;

    # تقييد حجم الحزمة لمنع هجمات Buffer Overflow
    client_max_body_size 2M;
    limit_conn addr_limit 20;

    # ==========================================================================
    # التوجيه إلى خادم الإشارات (Node.js Signaling Server)
    # ==========================================================================
    location / {
        limit_req zone=signaling_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # تمرير ترويسات ترقية WebSocket لدعم WSS
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ترويسات الشبكة الحقيقية
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # إعدادات الـ Timeouts لاتصالات WebSocket الطويلة
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # حظر الوصول إلى الملفات المخفية والـ Git
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
