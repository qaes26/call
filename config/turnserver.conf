# ==============================================================================
# إعدادات خادم CoTURN المحصن للإنتاج (Production-Hardened CoTURN Configuration)
# الملف: /etc/turnserver.conf
# ==============================================================================

# منافذ الاستماع القياسية والمشفرة
listening-port=3478
tls-listening-port=5349

# منافذ ترحيل حزم الوسائط (UDP Relay Ports Range)
# يجب فتح هذا النطاق بدقة في الجدار الناري UFW
min-port=49152
max-port=65535

# اسم النطاق الخاص بك (Realm)
realm=turn.yourdomain.com

# ==============================================================================
# معايير المصادقة المؤقتة والأمان المشدد (Ephemeral Credentials - REST API RFC 5766)
# ==============================================================================
# تفعيل المصادقة عبر المفتاح السري فقط ومنع المستخدمين العشوائيين
use-auth-secret
static-auth-secret=ddcf348d65b1ed58c81af8568faa4ad2c72df2b3d5fec285b399198173708e78

# حظر المستخدمين القدامى أو طلبات الاتصال المجهولة
no-cli
no-tcp-relay
stale-nonce=600

# ==============================================================================
# شهادات التشفير لبروتوكول TURNS (TLS / DTLS)
# ==============================================================================
cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

# فرض خوارزميات التشفير الحديثة والقوية
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# ==============================================================================
# الحماية من الاختراق ومسح الشبكات الداخلية (Anti-SSRF & Network Hardening)
# ==============================================================================
# منع الخادم من إعادة توجيه الحزم إلى أجهزة الشبكة المحلية أو الـ Localhost
no-loopback-peers
no-multicast-peers

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1

# ==============================================================================
# الأداء وتسجيل الأحداث (Logging & Quotas)
# ==============================================================================
# تحديد الحد الأقصى للمخصصات لكل مستخدم لمنع استنزاف موارد الخادم
user-quota=10
total-quota=200

# حفظ السجلات عبر syslog
syslog
no-stdout-log
